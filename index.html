<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device width, initial-scale=1.0">
        <title>Interactive Photo Gallery</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Interactive Photo Gallery</h1>
        <div id="image">
            Hover over an image below to display it here.
        </div>
        <div class="gallery">
        <img class="preview" alt="Lush, green spring scenery" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" onmouseover="upDate(this)" onmouseout="unDo()">
        <img class="preview" alt="Sunset over the sea, radiant with golden hues" src="https://images.unsplash.com/photo-1519074069444-1ba4ea16d66c" onmouseover="upDate(this)" onmouseout="unDo()">
        <img class="preview" alt="The majestic mountain, covered in white snow" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b" onmouseover="upDate(this)" onmouseout="unDo()">
        </div>
        <script src="gallery.js"></script>
    </body>
</html>
